name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # health.test.ts runs real tmux_alive probes. ubuntu-latest preinstalls
      # tmux, but macos-latest does not — without this the health-sweep tests
      # fail with "tmux binary not found". Windows has no tmux package and uses
      # a different process model, so it's POSIX-only here.
      - name: Install tmux (POSIX — for health-check tests)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi

      - name: Test
        run: bun test

      - name: Verify bundle exists (POSIX)
        if: runner.os != 'Windows'
        run: test -f dist/tmx.js

      - name: Verify bundle exists (Windows)
        if: runner.os == 'Windows'
        run: Test-Path dist/tmx.js
        shell: pwsh

      - name: Smoke test (--version)
        run: node dist/tmx.js --version

      # Build the dashboard on every matrix OS so a Svelte syntax error,
      # Tailwind theme regression, or types-vs-types drift between CLI and
      # dashboard fails the build instead of slipping through to the
      # ubuntu-only e2e job. fix-android-binaries.mjs is a no-op off Android.
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install

      - name: Build dashboard
        working-directory: dashboard
        run: bun run build

      - name: Verify dashboard bundle exists (POSIX)
        if: runner.os != 'Windows'
        run: test -f dashboard/dist/index.html

      - name: Verify dashboard bundle exists (Windows)
        if: runner.os == 'Windows'
        run: Test-Path dashboard/dist/index.html
        shell: pwsh

      - name: Check API docs updated if API source changed
        if: github.event_name == 'pull_request' && runner.os != 'Windows'
        run: |
          API_CHANGED=$(git diff --name-only origin/main HEAD -- src/http.ts src/ipc.ts 2>/dev/null | wc -l)
          if [ "$API_CHANGED" -gt "0" ]; then
            DOCS_CHANGED=$(git diff --name-only origin/main HEAD -- docs/api.md | wc -l)
            if [ "$DOCS_CHANGED" -eq "0" ]; then
              echo "ERROR: API source changed (src/http.ts or src/ipc.ts) but docs/api.md was not updated."
              echo "Please update docs/api.md to reflect the API changes."
              exit 1
            fi
          fi

  first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: operad init (fresh HOME)
        run: |
          export HOME=$(mktemp -d)
          node dist/tmx.js init
          test -f "$HOME/.config/operad/operad.toml" || (echo "init did not create config" && exit 1)
          echo "Config created:"
          cat "$HOME/.config/operad/operad.toml"

      - name: operad doctor (fresh install, expect only warnings not failures)
        run: |
          export HOME=$(mktemp -d)
          node dist/tmx.js init
          node dist/tmx.js doctor || echo "doctor reported issues (expected on CI)"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Build CLI
        run: bun run build

      - name: Build dashboard
        run: cd dashboard && bun install && bun run build

      - name: E2E tests
        run: bun test src/__tests__/e2e.test.ts --timeout 60000

  # Validates the 'fresh machine' story: no tmux preinstalled, install
  # operadic from a packed tarball (simulating `bun add -g operadic`),
  # then run `operad install-tmux --yes` and verify tmux becomes
  # callable. Catches regressions in the install-tmux package-manager
  # detection + invocation path that normal CI doesn't exercise
  # (because the build matrix has tmux preinstalled for other tests).
  fresh-install-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Remove preinstalled tmux
        run: |
          sudo apt-get remove -y tmux || true
          if command -v tmux >/dev/null 2>&1; then
            echo "ERROR: tmux still on PATH after remove" >&2
            exit 1
          fi

      - name: Install deps + build + pack
        run: |
          bun install
          bun run build
          npm pack
          ls -la operadic-*.tgz

      # bun add -g doesn't resolve local tarball paths — use npm for install,
      # which puts the binary on standard PATH (/usr/local/bin/operad). This
      # still exercises the same dist/tmx.js bundle and bin mapping.
      - name: Install from tarball globally (npm)
        run: |
          sudo npm install -g "$(ls operadic-*.tgz | head -1)"
          which operad
          operad --version

      - name: Verify tmux is NOT on PATH (control check)
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux unexpectedly present" >&2
            exit 1
          fi
          echo "confirmed: tmux not installed"

      - name: Run operad install-tmux --yes
        run: operad install-tmux -y

      - name: Verify tmux is NOW on PATH
        run: |
          tmux -V
          echo "tmux installed successfully via operad install-tmux"

      - name: operad init + doctor on fresh HOME
        run: |
          export HOME=$(mktemp -d)
          operad init
          operad doctor || echo "(doctor may warn — non-fatal for this check)"

  fresh-install-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps + build + pack
        run: |
          bun install
          bun run build
          npm pack
          Get-ChildItem operadic-*.tgz

      # bun add -g doesn't resolve local tarball paths on Windows either
      - name: Install from tarball globally (npm)
        run: |
          $tarball = (Get-ChildItem operadic-*.tgz | Select-Object -First 1).Name
          npm install -g ".\$tarball"
          operad --version

      - name: Verify winget is available
        run: winget --version

      # We DON'T actually run `operad install-tmux -y` on Windows CI:
      # winget install against a fresh runner needs msstore source agreement
      # + UAC negotiation that's hard to script non-interactively. Instead
      # we verify the non-interactive code path prints the right guidance.
      - name: "operad install-tmux (non-interactive — expect instructions, exit 0)"
        run: |
          $out = operad install-tmux 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "winget install") {
            Write-Error "Expected non-interactive output to include the winget command"
            exit 1
          }
          exit 0

      - name: "operad doctor (tmux-windows WARN must mention winget)"
        run: |
          # operad doctor intentionally exits 1 when any check fails
          # (tmux is missing here). Capture output and reset exit code.
          $out = operad doctor 2>&1 | Out-String
          $LASTEXITCODE = 0
          Write-Host $out
          if ($out -notmatch "winget") {
            Write-Error "Expected doctor output to mention winget when tmux missing"
            exit 1
          }
          exit 0

