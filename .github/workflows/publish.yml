name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build CLI bundle
        run: bun run build

      # package.json#files ships `dashboard/dist/`, but nothing else in this
      # job produces it — `bun run build` only runs esbuild on the CLI. Without
      # these two steps the published tarball contains no web UI at all and
      # every install reports "Dashboard dist not bundled" (the 0.4.7 bug).
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install

      - name: Build dashboard
        working-directory: dashboard
        run: bun run build

      # Hard gate: refuses to publish a tarball missing dist/tmx.js, the
      # dashboard SPA, or the docs npm renders on the package page.
      - name: Verify package contents
        run: node scripts/verify-package.mjs

      # Node 24 ships with npm >= 11.5.1, required for OIDC trusted publishing.
      # Node 22 ships with npm 10.x which silently falls back to token auth.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Publish via trusted publisher (OIDC). Configured on npmjs.com:
      #   Package settings → Access → Trusted Publishers
      #   Repo: tribixbite/operad, Workflow: .github/workflows/publish.yml
      # `id-token: write` (granted above) lets npm exchange the GitHub OIDC
      # token for an npm publish token. NO NPM_TOKEN secret needed.
      #
      # CRITICAL: do NOT set NODE_AUTH_TOKEN here. setup-node injects an
      # empty `_authToken=` line into .npmrc when the secret is unset,
      # which makes npm think auth is configured and skip OIDC → ENEEDAUTH.
      - name: Publish
        run: npm publish --provenance --access public
